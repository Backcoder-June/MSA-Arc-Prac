server:
  port: 8070
spring:
  application:
    name: gateway-server
  profiles:
    active: docker
  cloud:
    config:
      uri: http://config-server:8080
    loadbalancer:
      ribbon:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka

management:
  endpoints:
    web:
      exposure:
        include: refresh, health, beans