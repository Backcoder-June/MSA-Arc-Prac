logging:
  file:
    name: logs/api.log
    max-size: 500MB
    max-history: 10
  level:
    root: info
    org.msa.item: debug

spring:
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/msa
    username: root
    password: '{cipher}49b3b67ad96c988bea0833e44b77446cf76b397311a98071f9727e5205f2ba5e'
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
